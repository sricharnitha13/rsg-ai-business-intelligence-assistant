<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini AI BI Assistant</title>
  <meta name="description" content="Ask natural-language questions about sales data and get SQL-backed answers." />
  <style>
    /* -------------------------------------------------------
       Design: dark glassmorphism with a teal/indigo accent palette.
       No frameworks — pure CSS.
    ------------------------------------------------------- */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d27;
      --glass:      rgba(255,255,255,0.05);
      --border:     rgba(255,255,255,0.08);
      --accent:     #6ee7b7;    /* teal-300 */
      --accent2:    #818cf8;    /* indigo-400 */
      --text:       #e2e8f0;
      --muted:      #94a3b8;
      --danger:     #f87171;
      --radius:     14px;
      --shadow:     0 8px 32px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    /* ---- Header ---- */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }

    /* ---- Main card ---- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 820px;
      padding: 2rem;
      backdrop-filter: blur(12px);
    }

    /* ---- Example buttons ---- */
    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .examples p {
      width: 100%;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .example-btn {
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.8rem;
      padding: 0.35rem 0.85rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: inherit;
    }
    .example-btn:hover {
      background: rgba(110,231,183,0.1);
      transform: translateY(-1px);
    }

    /* ---- Input row ---- */
    .input-row {
      display: flex;
      gap: 0.75rem;
    }
    #question-input {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #question-input:focus { border-color: var(--accent); }
    #question-input::placeholder { color: var(--muted); }

    #ask-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: var(--radius);
      color: #0f1117;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    #ask-btn:hover:not(:disabled) { opacity: 0.85; transform: translateY(-1px); }
    #ask-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ---- Spinner ---- */
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Response area ---- */
    #response-area {
      margin-top: 1.75rem;
      display: none;
    }

    .answer-box {
      background: rgba(110,231,183,0.07);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 1rem 1.25rem;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.25rem;
      animation: fadeIn 0.3s ease;
    }
    .answer-box.error {
      background: rgba(248,113,113,0.07);
      border-left-color: var(--danger);
    }

    /* ---- Badge ---- */
    .meta-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }
    .badge-intent  { background: rgba(129,140,248,0.15); color: var(--accent2); border: 1px solid rgba(129,140,248,0.3); }
    .badge-path    { background: rgba(110,231,183,0.1);  color: var(--accent);  border: 1px solid rgba(110,231,183,0.2); }

    /* ---- Data table ---- */
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th {
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      font-weight: 600;
      padding: 0.6rem 1rem;
      text-align: left;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
    }
    td {
      padding: 0.55rem 1rem;
      border-top: 1px solid var(--border);
      color: var(--text);
    }
    tr:hover td { background: rgba(255,255,255,0.02); }

    /* ---- SQL collapsible ---- */
    details {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    summary {
      cursor: pointer;
      padding: 0.65rem 1rem;
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 500;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      user-select: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before {
      content: '▶';
      font-size: 0.65rem;
      transition: transform 0.2s;
    }
    details[open] summary::before { transform: rotate(90deg); }
    pre {
      background: rgba(0,0,0,0.3);
      color: #a5f3fc;
      font-size: 0.78rem;
      line-height: 1.5;
      padding: 1rem;
      overflow-x: auto;
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  </style>
</head>
<body>

<header>
  <h1>🔍 Mini AI BI Assistant</h1>
  <p>Ask a question about your sales data — powered by real SQL results.</p>
</header>

<main class="card" id="main-card">

  <!-- Example question buttons -->
  <div class="examples" id="examples">
    <p>Try an example:</p>
    <button class="example-btn" data-q="What is the total revenue?">Total revenue</button>
    <button class="example-btn" data-q="Which product generated the highest revenue?">Top product</button>
    <button class="example-btn" data-q="What is the monthly revenue trend?">Monthly trend</button>
    <button class="example-btn" data-q="Which region generated the highest sales?">Top region</button>
    <button class="example-btn" data-q="How did revenue change between 2026-01 and 2026-02?">Jan vs Feb</button>
  </div>

  <!-- Question input -->
  <div class="input-row">
    <input
      id="question-input"
      type="text"
      placeholder="Ask a question about your sales data…"
      aria-label="Question input"
      maxlength="500"
    />
    <button id="ask-btn" aria-label="Ask question">Ask</button>
  </div>

  <!-- Spinner -->
  <div class="spinner" id="spinner" role="status" aria-live="polite"></div>

  <!-- Response area (hidden until a question is answered) -->
  <section id="response-area" aria-live="polite">

    <!-- Answer sentence -->
    <div id="answer-box" class="answer-box"></div>

    <!-- Intent + path badges -->
    <div class="meta-row">
      <span class="badge badge-intent" id="badge-intent"></span>
      <span class="badge badge-path"   id="badge-path"></span>
    </div>

    <!-- Supporting data table -->
    <div class="table-wrap" id="table-wrap" style="display:none">
      <table id="result-table">
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <!-- Collapsible SQL section -->
    <details id="sql-details" style="display:none">
      <summary>🗃 SQL used</summary>
      <pre id="sql-pre"></pre>
    </details>

  </section>
</main>

<script>
  /* -------------------------------------------------------
     Vanilla JS — no framework.
     Communicates with POST /ask and renders the response.
  ------------------------------------------------------- */

  const input      = document.getElementById('question-input');
  const askBtn     = document.getElementById('ask-btn');
  const spinner    = document.getElementById('spinner');
  const respArea   = document.getElementById('response-area');
  const answerBox  = document.getElementById('answer-box');
  const badgeIntent = document.getElementById('badge-intent');
  const badgePath   = document.getElementById('badge-path');
  const tableWrap  = document.getElementById('table-wrap');
  const tableHead  = document.getElementById('table-head');
  const tableBody  = document.getElementById('table-body');
  const sqlDetails = document.getElementById('sql-details');
  const sqlPre     = document.getElementById('sql-pre');

  // Wire example buttons
  document.querySelectorAll('.example-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      input.value = btn.dataset.q;
      input.focus();
    });
  });

  // Ask on button click or Enter key
  askBtn.addEventListener('click', submitQuestion);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submitQuestion(); });

  async function submitQuestion() {
    const question = input.value.trim();
    if (!question) return;

    // UI: loading state
    setLoading(true);
    clearResponse();

    try {
      const resp = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });

      const data = await resp.json();

      if (!resp.ok) {
        showError(data.detail || data.error || 'Unknown error');
        return;
      }

      renderResponse(data);

    } catch (err) {
      showError('Network error: ' + err.message);
    } finally {
      setLoading(false);
    }
  }

  function renderResponse(data) {
    respArea.style.display = 'block';

    // Answer sentence
    answerBox.textContent = data.answer;
    answerBox.classList.remove('error');

    // Badges
    badgeIntent.textContent = '🎯 ' + (data.intent || 'unknown');
    badgePath.textContent   = '⚙ '  + (data.path_used || '');

    // Data table
    if (data.columns && data.columns.length && data.rows && data.rows.length) {
      tableWrap.style.display = 'block';

      // Header row
      tableHead.innerHTML = '<tr>' +
        data.columns.map(c => `<th>${escHtml(c)}</th>`).join('') +
        '</tr>';

      // Data rows
      tableBody.innerHTML = data.rows.map(row =>
        '<tr>' + row.map(cell => `<td>${escHtml(String(cell ?? ''))}</td>`).join('') + '</tr>'
      ).join('');
    }

    // SQL section
    if (data.sql) {
      sqlDetails.style.display = 'block';
      sqlPre.textContent = data.sql;
    }
  }

  function showError(msg) {
    respArea.style.display = 'block';
    answerBox.textContent = '⚠ ' + msg;
    answerBox.classList.add('error');
  }

  function clearResponse() {
    respArea.style.display = 'none';
    tableWrap.style.display = 'none';
    sqlDetails.style.display = 'none';
    tableHead.innerHTML = '';
    tableBody.innerHTML = '';
    sqlPre.textContent = '';
    answerBox.className = 'answer-box';
  }

  function setLoading(on) {
    askBtn.disabled = on;
    spinner.style.display = on ? 'block' : 'none';
  }

  // Simple HTML-escape helper (prevents XSS from data values)
  function escHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>

</body>
</html>
